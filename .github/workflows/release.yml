name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: rs-web-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: rs-web-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: rs-web-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: rs-web-darwin-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.name }}-${{ github.ref_name }}.tar.gz rs-web
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ github.ref_name }}
          path: ${{ matrix.name }}-${{ github.ref_name }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            mv "$dir"/*.tar.gz .
          done
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG="${{ github.ref_name }}"

          echo "Generating changelog from ${PREV_TAG:-beginning} to ${CURRENT_TAG}"

          # Start building the changelog
          CHANGELOG=""

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s|%h" $CURRENT_TAG)
          else
            COMMITS=$(git log --pretty=format:"%s|%h" ${PREV_TAG}..${CURRENT_TAG})
          fi

          # Categorize commits
          FEATURES=""
          FIXES=""
          CHORES=""
          DOCS=""
          REFACTOR=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG=$(echo "$line" | cut -d'|' -f1)
            HASH=$(echo "$line" | cut -d'|' -f2)

            COMMIT_LINK="https://github.com/${{ github.repository }}/commit/${HASH}"
            case "$MSG" in
              feat:*|feat\(*) FEATURES="${FEATURES}- ${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              fix:*|fix\(*) FIXES="${FIXES}- ${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              chore:*|chore\(*) CHORES="${CHORES}- ${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              docs:*|docs\(*) DOCS="${DOCS}- ${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              refactor:*|refactor\(*) REFACTOR="${REFACTOR}- ${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              *) OTHER="${OTHER}- ${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
            esac
          done <<< "$COMMITS"

          # Build final changelog
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}## Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}## Bug Fixes\n${FIXES}\n"
          fi
          if [ -n "$REFACTOR" ]; then
            CHANGELOG="${CHANGELOG}## Refactoring\n${REFACTOR}\n"
          fi
          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}## Documentation\n${DOCS}\n"
          fi
          if [ -n "$CHORES" ]; then
            CHANGELOG="${CHANGELOG}## Chores\n${CHORES}\n"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}## Other Changes\n${OTHER}\n"
          fi

          # Add compare link
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG="${CHANGELOG}\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
          fi

          # Write to file for the release action
          echo -e "$CHANGELOG" > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          body_path: CHANGELOG.md

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
