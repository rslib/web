name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: rs-web-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: rs-web-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: rs-web-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: rs-web-darwin-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.name }}-${{ github.ref_name }}.tar.gz rs-web
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ github.ref_name }}
          path: ${{ matrix.name }}-${{ github.ref_name }}.tar.gz

  release:
    name: Release & Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for changelog

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            mv "$dir"/*.tar.gz .
          done
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Generate Changelog
        id: changelog
        run: |
          # Get all tags sorted by version
          CURRENT_TAG="${{ github.ref_name }}"

          # Get the previous tag (excluding current)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n1)

          echo "Generating changelog from ${PREV_TAG:-beginning} to ${CURRENT_TAG}"

          # Start building the changelog
          CHANGELOG=""

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s|%h" $CURRENT_TAG)
          else
            COMMITS=$(git log --pretty=format:"%s|%h" ${PREV_TAG}..${CURRENT_TAG})
          fi

          # Categorize commits
          FEATURES=""
          FIXES=""
          CHORES=""
          DOCS=""
          REFACTOR=""
          PERF=""
          TESTS=""
          BUILD=""
          CI=""
          BREAKING=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG=$(echo "$line" | cut -d'|' -f1)
            HASH=$(echo "$line" | cut -d'|' -f2)

            # Skip version bump commits - these are release automation, not actual changes
            if echo "$MSG" | grep -qiE "^chore!?(\([^)]*\))?:.*bump.*(version|to v?[0-9])"; then
              echo "Skipping version bump commit: $MSG"
              continue
            fi

            COMMIT_LINK="https://github.com/${{ github.repository }}/commit/${HASH}"

            # Check for breaking changes (indicated by ! after type)
            IS_BREAKING=""
            if echo "$MSG" | grep -qE "^[a-z]+!(\([^)]*\))?:"; then
              IS_BREAKING="**BREAKING** "
            fi

            case "$MSG" in
              feat:*|feat!:*|feat\(*) FEATURES="${FEATURES}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              fix:*|fix!:*|fix\(*) FIXES="${FIXES}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              perf:*|perf!:*|perf\(*) PERF="${PERF}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              refactor:*|refactor!:*|refactor\(*) REFACTOR="${REFACTOR}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              docs:*|docs!:*|docs\(*) DOCS="${DOCS}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              test:*|test!:*|test\(*|tests:*|tests\(*) TESTS="${TESTS}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              build:*|build!:*|build\(*) BUILD="${BUILD}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              ci:*|ci!:*|ci\(*) CI="${CI}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              chore:*|chore!:*|chore\(*) CHORES="${CHORES}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
              *) OTHER="${OTHER}- ${IS_BREAKING}${MSG} ([${HASH}](${COMMIT_LINK}))\n" ;;
            esac
          done <<< "$COMMITS"

          # Build final changelog (ordered by importance)
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}## Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}## Bug Fixes\n${FIXES}\n"
          fi
          if [ -n "$PERF" ]; then
            CHANGELOG="${CHANGELOG}## Performance\n${PERF}\n"
          fi
          if [ -n "$REFACTOR" ]; then
            CHANGELOG="${CHANGELOG}## Refactoring\n${REFACTOR}\n"
          fi
          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}## Documentation\n${DOCS}\n"
          fi
          if [ -n "$TESTS" ]; then
            CHANGELOG="${CHANGELOG}## Tests\n${TESTS}\n"
          fi
          if [ -n "$BUILD" ]; then
            CHANGELOG="${CHANGELOG}## Build\n${BUILD}\n"
          fi
          if [ -n "$CI" ]; then
            CHANGELOG="${CHANGELOG}## CI\n${CI}\n"
          fi
          if [ -n "$CHORES" ]; then
            CHANGELOG="${CHANGELOG}## Chores\n${CHORES}\n"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}## Other Changes\n${OTHER}\n"
          fi

          # Add compare link
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG="${CHANGELOG}\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
          fi

          # Handle empty changelog
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No notable changes in this release.\n"
          fi

          # Write to file for the release action
          echo -e "$CHANGELOG" > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          body_path: CHANGELOG.md

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
