name: Nix

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  nix:
    name: Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/flake-checker-action@main
        if: matrix.os == 'ubuntu-latest'

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Run flake check only on ubuntu (includes clippy, formatting)
      - name: Flake Check
        if: matrix.os == 'ubuntu-latest'
        run: nix flake check

      - name: Build
        run: nix build .#rs-web

      # Push to cachix only on release/manual trigger
      - uses: cachix/cachix-action@v15
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: ${{ vars.CACHIX_CACHE_NAME }}

      - name: Push to Cache
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: nix build .#rs-web --json | jq -r '.[].outputs | to_entries[].value' | cachix push ${{ vars.CACHIX_CACHE_NAME }}
