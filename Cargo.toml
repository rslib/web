[package]
name = "rs-web"
version = "0.4.1"
edition = "2024"
description = "A fast, Lua-driven static site generator with encryption support"
authors = ["Ray Andrew Sinurat"]
repository = "https://github.com/rslib/web"
license = "MIT"
keywords = ["static-site", "blog", "markdown", "encryption", "lua"]
categories = ["command-line-utilities", "web-programming"]
include = ["/src/**/*", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[dependencies]
# Markdown
pulldown-cmark = { version = "0.13", features = ["simd"] }

# Templates (runtime)
tera = { version = "1.20", features = ["date-locale"] }

# Config & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.9"

# Lua scripting
mlua = { version = "0.11", features = [
  "lua54",
  "vendored",
  "serialize",
  "send",
] }

# Date handling
chrono = { version = "0.4", features = ["serde"] }

# Image processing
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }
webp = "0.3"
kamadak-exif = "0.5"

# HTML minification
minify-html = "0.16"

# Syntax highlighting
syntect = { version = "5.2", default-features = false, features = [
  "default-syntaxes",
  "default-themes",
  "html",
  "regex-onig",
] }

# JS bundling
brk_rolldown = "0.8"
brk_rolldown_plugin = "0.8"

# JS minification (OXC - version matched with brk_rolldown)
oxc_allocator = "0.108"
oxc_parser = "0.108"
oxc_minifier = "0.108"
oxc_codegen = "0.108"
oxc_span = "0.108"

# CSS bundling & processing
lightningcss = "1.0.0-alpha.67"

# File operations
walkdir = "2.5"
ignore = "0.4"
glob = "0.3"
dirs = "6.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Parallel processing
rayon = "1.11"

# Concurrent data structures & caching
dashmap = "6.1"
parking_lot = "0.12"
twox-hash = "1.6"
postcard = { version = "1.1", features = ["alloc"] }

# Hashing (for asset fingerprinting)
sha2 = "0.10"
hex = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"

# Regex for encrypted blocks
regex = "1.12"
once_cell = "1.21"

# File watching
notify = "8.2"
notify-debouncer-mini = "0.7"

# Git metadata
git2 = { version = "0.20", default-features = false }

# URL encoding
urlencoding = "2.1"

# Async runtime & HTTP client
tokio = { version = "1.49", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
futures = "0.3"

# Dev server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

[dev-dependencies]
tempfile = "3.24"

[profile.release]
lto = true
codegen-units = 1
strip = true
